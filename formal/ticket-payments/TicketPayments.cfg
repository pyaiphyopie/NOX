\* TLC config for TicketPayments — keep bounds small for agent reruns.
CONSTANTS
  QtyTotal = 2
  Orders = {o1, o2}
  EventIds = {e1, e2, e3}

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT InventoryBound
INVARIANT TicketsOnlyWhenPaid
INVARIANT PaidHasTicket
INVARIANT SoldEqualsIssued
INVARIANT ReservedAccountsForProcessing
INVARIANT AtomicReserveRollback
INVARIANT CompletedImpliesPaid
INVARIANT MismatchNoTickets

\* Optional: uncomment CHECK_DEADLOCK to hunt stuck states (off by default).
\* CHECK_DEADLOCK FALSE
