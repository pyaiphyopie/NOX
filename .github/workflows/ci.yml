name: CI — Build, Lint, Test, Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck auth-service
        run: pnpm --filter @nox/auth-service typecheck

      - name: Prettier (auth + packages)
        run: pnpm -w exec prettier --check "backend/**/*.{ts,json,md}" "packages/**/*.{ts,json,md}" ".github/workflows/*.{yml,yaml}"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Compile auth-service
        run: pnpm --filter @nox/auth-service exec tsc --noEmit --pretty false

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Auth-service unit tests
        run: pnpm --filter @nox/auth-service exec jest --passWithNoTests --ci

  audit:
    name: Security Audit (pnpm + SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=critical || true

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Skipped
        run: echo "Prototype Dockerfile is not the Nest monorepo image."
